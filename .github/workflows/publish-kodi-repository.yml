name: Publish Kodi repository

on:
  push:
    branches:
      - main
    paths:
      - 'cocoscrapers-source/**'
      - 'fenlight-source/**'
      - 'repository.tinkerer/**'
      - 'build-cocoscrapers-package.ps1'
      - 'build-fenlight-package.ps1'
      - 'build-kodi-repository.ps1'
      - '.github/workflows/publish-kodi-repository.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build repository output
        shell: pwsh
        run: .\build-kodi-repository.ps1

      - name: Commit generated repository output
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kodi-repo
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Kodi repository packages"
            git push
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./kodi-repo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
